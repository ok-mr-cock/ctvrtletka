<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Překryj červenou parabolu (a, b, c)</title>
<style>
:root{--bg:#f7f7f4;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--grid:#e3e3dd;--ax:#8a8a84;--cur:#2563eb;--red:#dc2626;--ok:#15803d;--bad:#b45309;--bd:#d6d6cf;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171717;--card:#222;--tx:#eee;--mut:#a0a09a;--grid:#333;--ax:#777;--cur:#60a5fa;--red:#f87171;--ok:#4ade80;--bad:#fbbf24;--bd:#444}}
:root[data-theme="dark"]{--bg:#171717;--card:#222;--tx:#eee;--mut:#a0a09a;--grid:#333;--ax:#777;--cur:#60a5fa;--red:#f87171;--ok:#4ade80;--bad:#fbbf24;--bd:#444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-top:12px}
.fn{font-family:Georgia,serif;font-size:1.2rem;text-align:center;margin:6px 0}
svg{width:100%;height:auto;display:block}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}
.row label{width:28px;font-weight:700;font-family:Georgia,serif;font-size:1.1rem}
.row input[type=range]{flex:1}
.row input[type=number]{width:72px;padding:6px;font-size:1rem;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
button.p{background:var(--cur);border-color:var(--cur);color:#fff}
#msg{min-height:3em;margin-top:10px;font-weight:600}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.leg{display:flex;gap:16px;justify-content:center;font-size:.92rem;color:var(--mut)}
.leg i{display:inline-block;width:22px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
</style>
</head>
<body>
<main>
<h1>Překryj červenou parabolu – tři parametry</h1>
<div class="card">
V grafu je červená parabola. Zvol hodnoty parametrů <b>a</b>, <b>b</b> a <b>c</b> tak, aby modrá parabola <b>y = c·(x − a)² + b</b> přesně překryla červenou.
</div>
<div class="card">
<div class="fn">y = <span id="fc">1</span>·(x − <span id="fa">0</span>)² + <span id="fb">0</span></div>
<svg id="g" viewBox="0 0 560 560" role="img" aria-label="Graf"></svg>
<div class="leg"><span><i style="background:var(--red)"></i>zadaná parabola</span><span><i style="background:var(--cur)"></i>tvoje parabola</span></div>
<div class="row"><label>a</label><input type="range" id="sa" min="-10" max="10" step="0.5" value="0"><input type="number" id="na" min="-10" max="10" step="0.5" value="0"></div>
<div class="row"><label>b</label><input type="range" id="sb" min="-6" max="14" step="0.5" value="0"><input type="number" id="nb" min="-6" max="14" step="0.5" value="0"></div>
<div class="row"><label>c</label><input type="range" id="sc" min="-4" max="4" step="0.5" value="1"><input type="number" id="nc" min="-4" max="4" step="0.5" value="1"></div>
<div class="btns"><button class="p" id="chk">Zkontrolovat</button><button id="sol">Ukázat řešení</button><button id="new">Nová úloha</button></div>
<div id="msg" aria-live="polite"></div>
</div>
</main>
<script>
const X0=-10,X1=10,Y0=-6,Y1=14,W=560,H=560;
const sx=x=>(x-X0)/(X1-X0)*W, sy=y=>H-(y-Y0)/(Y1-Y0)*H;
const $=id=>document.getElementById(id);
let T=null;
const ri=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
const f=(x,a,b,c)=>c*(x-a)*(x-a)+b;
const fmt=v=>String(Math.round(v*100)/100).replace('.',',');
const val=id=>{const v=parseFloat($(id).value);return isNaN(v)?0:v};
function newTask(){
  const cs=[-2,-1.5,-1,-0.5,0.5,1.5,2,3];
  do{
    const c=cs[ri(0,cs.length-1)];
    T={a:ri(-5,5),c,b:c>0?ri(-4,6):ri(3,10)};
  }while(T.a===0&&T.b===0&&T.c===1);
  set(0,0,1);$('msg').textContent='';$('msg').className='';
}
function set(a,b,c){
  for(const id of ['sa','na'])$(id).value=a;
  for(const id of ['sb','nb'])$(id).value=b;
  for(const id of ['sc','nc'])$(id).value=c;
  draw();
}
function path(a,b,c){
  let d='';
  for(let i=0;i<=400;i++){const x=X0+(X1-X0)*i/400;d+=(i?'L':'M')+sx(x).toFixed(1)+' '+sy(f(x,a,b,c)).toFixed(1)}
  return d;
}
function draw(){
  const a=val('sa'),b=val('sb'),c=val('sc');
  $('fa').textContent=fmt(a);$('fb').textContent=fmt(b);$('fc').textContent=fmt(c);
  let s='<defs><clipPath id="c"><rect width="560" height="560"/></clipPath></defs>';
  for(let x=X0;x<=X1;x++)s+=`<line x1="${sx(x)}" y1="0" x2="${sx(x)}" y2="${H}" stroke="var(--grid)"/>`;
  for(let y=Y0;y<=Y1;y++)s+=`<line x1="0" y1="${sy(y)}" x2="${W}" y2="${sy(y)}" stroke="var(--grid)"/>`;
  s+=`<line x1="${sx(0)}" y1="0" x2="${sx(0)}" y2="${H}" stroke="var(--ax)" stroke-width="1.5"/><line x1="0" y1="${sy(0)}" x2="${W}" y2="${sy(0)}" stroke="var(--ax)" stroke-width="1.5"/>`;
  for(let x=-10;x<=10;x+=2)if(x)s+=`<text x="${sx(x)}" y="${sy(0)+14}" font-size="11" text-anchor="middle" fill="var(--mut)">${x}</text>`;
  for(let y=-6;y<=14;y+=2)if(y)s+=`<text x="${sx(0)+5}" y="${sy(y)+4}" font-size="11" fill="var(--mut)">${y}</text>`;
  s+=`<path d="${path(T.a,T.b,T.c)}" fill="none" stroke="var(--red)" stroke-width="7" stroke-linecap="round" clip-path="url(#c)"/>`;
  s+=`<path d="${path(a,b,c)}" fill="none" stroke="var(--cur)" stroke-width="3" clip-path="url(#c)"/>`;
  $('g').innerHTML=s;
}
for(const k of ['a','b','c']){
  $('s'+k).addEventListener('input',()=>{$('n'+k).value=$('s'+k).value;draw()});
  $('n'+k).addEventListener('input',()=>{$('s'+k).value=$('n'+k).value;draw()});
}
$('chk').onclick=()=>{
  const ok={a:Math.abs(val('sa')-T.a)<1e-9,b:Math.abs(val('sb')-T.b)<1e-9,c:Math.abs(val('sc')-T.c)<1e-9};
  const good=Object.keys(ok).filter(k=>ok[k]), bad=Object.keys(ok).filter(k=>!ok[k]), m=$('msg');
  if(!bad.length){m.className='ok';m.textContent='Správně! Paraboly se překrývají.'}
  else{
    m.className='bad';
    m.textContent=(good.length?'Správně: '+good.join(', ')+'. Uprav ještě: '+bad.join(', ')+'.':'Zatím žádný parametr nesedí.')+' Tip: nejdřív najdi vrchol (a, b), pak ladíš c – znaménko určuje směr otevření, velikost „strmost“.';
  }
};
$('sol').onclick=()=>{set(T.a,T.b,T.c);$('msg').className='';$('msg').textContent='Řešení: a = '+T.a+', b = '+T.b+', c = '+T.c};
$('new').onclick=newTask;
newTask();
</script>
</body>
</html>
