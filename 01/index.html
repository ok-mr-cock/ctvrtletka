<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Definicni obory funkci</title>
<style>
:root{
  --paper: #F5F7F0;
  --grid-line: rgba(63,92,110,0.09);
  --ink: #202B45;
  --ink-soft: #576079;
  --card: #FCFDFA;
  --red-pen: #B23A2E;
  --ring: #C9CCB8;
}
*{box-sizing:border-box;}
html,body{
  margin:0;padding:0;
  background:
    repeating-linear-gradient(0deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 26px),
    repeating-linear-gradient(90deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 26px),
    var(--paper);
  color:var(--ink);
  font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
}
.wrap{max-width:560px;margin:0 auto;padding:20px 14px 50px;}
header{text-align:center;margin-bottom:14px;}
h1{
  font-family: Georgia, "Times New Roman", serif;
  font-weight:700;font-size:1.9rem;margin:0 0 4px;color:var(--ink);
}
.subtitle{font-size:0.85rem;color:var(--ink-soft);margin:0;}

.nav{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:16px 0 22px;}
.navlink{
  font-size:0.78rem;font-weight:600;text-decoration:none;
  padding:6px 11px;border-radius:999px;border:1.5px solid;
  background:#fff;
}

section{margin-bottom:10px;}
h2{
  display:flex;align-items:center;gap:8px;
  font-size:1.05rem;margin:26px 0 12px;
}
h2 .bar{width:5px;height:1.1em;border-radius:2px;display:inline-block;}

.card-list{display:flex;flex-direction:column;gap:12px;}

.card{position:relative;}
.flip-toggle{position:absolute;opacity:0;width:0;height:0;pointer-events:none;}

.card-inner{position:relative;}
.face{
  display:block;
  background:var(--card);
  border-radius:12px;
  box-shadow:0 1px 2px rgba(32,43,69,0.06), 0 6px 14px rgba(32,43,69,0.08);
  padding:14px 16px;
  cursor:pointer;
}
.face.back{display:none;}
.flip-toggle:checked ~ .card-inner .face.front{display:none;}
.flip-toggle:checked ~ .card-inner .face.back{display:block;}

.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.num{font-weight:700;font-size:0.85rem;color:var(--ink-soft);}
.catpill{font-size:0.68rem;font-weight:700;color:#fff;padding:3px 9px;border-radius:999px;}

.formula-wrap{display:flex;justify-content:center;padding:10px 0;}
.formula-img{height:34px;width:auto;}

.result-line{
  display:flex;justify-content:center;
  background:#B23A2E14;border-left:3px solid var(--red-pen);
  border-radius:6px;padding:8px 10px;margin-bottom:10px;
}
.result-img{height:30px;width:auto;}

.steps{display:flex;flex-direction:column;gap:6px;padding-left:4px;}
.step{display:flex;align-items:center;}
.step::before{content:"\2013";color:var(--ink-soft);margin-right:6px;font-weight:700;}
.step-img{height:23px;width:auto;}

.hint{
  text-align:center;font-size:0.75rem;color:var(--ink-soft);
  margin-top:8px;font-style:italic;
}

.totop{
  display:block;text-align:center;font-size:0.78rem;color:var(--ink-soft);
  text-decoration:none;margin:14px 0 4px;
}

.tlacitko {
  display: flex;
  padding: 12px 20px;
  justify-content: center;
  background: #1b3a9c;
  color: #fff;
  text-decoration: none;
  font-weight: 700;
  border-radius: 12px;
}
.tlacitko:hover { background: #274bc4; }

footer{text-align:center;font-size:0.72rem;color:var(--ink-soft);margin-top:30px;}
</style>
</head>
